# Dependabot version updates (ADR-024). Security updates for known vulnerabilities are a separate
# repository setting and arrive regardless of this schedule.
#
# Weekly, with minor and patch updates grouped into one pull request per ecosystem, so the six
# services don't produce six PRs for the same library. Major updates come one by one: they can
# break things (Spring Boot, Angular, Java) and are reviewed on their own. Every PR runs CI with
# the full test suite; Dependabot PRs get no SONAR_TOKEN, so ci.js skips the SonarQube step there.
version: 2
updates:
  - package-ecosystem: maven
    directories: ["/services/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Angular's packages pin each other to the exact same version (peer dependencies), so they must
  # move together: a PR that bumps only @angular/router fails `npm ci` with ERESOLVE (2026-10-04,
  # PR #1). The angular groups come first, because a dependency joins the first group it matches;
  # one covers version updates, the other security updates. TypeScript is in the group because
  # Angular decides which TypeScript versions it supports (PR #9 tried TypeScript 7 on Angular 21).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        applies-to: version-updates
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "typescript"]
      angular-security:
        applies-to: security-updates
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "typescript"]
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"

  # Base images in the seven Dockerfiles (eclipse-temurin, node, nginx-unprivileged).
  # The maven build image is excluded: its tags put the JDK in the suffix (3.9-eclipse-temurin-25),
  # and Dependabot proposed 3-eclipse-temurin-24, a JDK downgrade that breaks the Java 25 build
  # (PR #11). Update it by hand together with the JDK.
  - package-ecosystem: docker
    directories: ["/services/*", "/frontend"]
    ignore:
      - dependency-name: maven
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(docker)"
