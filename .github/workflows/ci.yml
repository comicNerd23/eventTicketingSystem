# Build + test pipeline for the six Spring Boot services and the Angular frontend.
# Every job runs the same `node ci.js <target>` command a developer runs locally
# (docs/adr/ADR-015-ci-pipeline-and-local-testing.md), so local and CI results match.
#
# Kept inside the GitHub Free Actions quota (private repo, 2,000 min/month):
# path filters so only changed targets run, cancellation of superseded runs,
# Maven/npm caching, and no image push (docker build only verifies the Dockerfiles).
#
# Each target is also analyzed in SonarQube Cloud with its coverage (ADR-023): one project per
# target, keyed <SONAR_ORGANIZATION>_<target>, and a failed quality gate fails the job. Secret
# SONAR_TOKEN and variable SONAR_ORGANIZATION (Settings → Secrets and variables → Actions); without
# them, e.g. in pull requests from forks, ci.js skips the analysis and only runs the tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed targets
    runs-on: ubuntu-26.04
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A change to the pipeline itself (ci.js or this file) re-runs every target.
          filters: |
            pipeline: &pipeline
              - ci.js
              - .github/workflows/ci.yml
            api-gateway:
              - *pipeline
              - services/api-gateway/**
            event-service:
              - *pipeline
              - services/event-service/**
            booking-service:
              - *pipeline
              - services/booking-service/**
            payment-service:
              - *pipeline
              - services/payment-service/**
            notification-service:
              - *pipeline
              - services/notification-service/**
            waitlist-service:
              - *pipeline
              - services/waitlist-service/**
            frontend:
              - *pipeline
              - frontend/**
      - id: pick
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          all='["api-gateway","event-service","booking-service","payment-service","notification-service","waitlist-service"]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            services="$all"
            frontend=true
          else
            services=$(echo "$CHANGES" | jq -c --argjson all "$all" '[.[] | select(IN($all[]))]')
            frontend=$(echo "$CHANGES" | jq 'index("frontend") != null')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "services: $services, frontend: $frontend"

  service:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so SonarQube can tell new code from old (blame)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Testcontainers uses the runner's own Docker daemon here — no Testcontainers Cloud.
      - run: node ci.js ${{ matrix.service }} --docker --sonar
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node ci.js frontend --docker --sonar
