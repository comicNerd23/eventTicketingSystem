version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    depends_on: [kafka]
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --notify-keyspace-events KEA

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  booking-service:
    build:
      context: ../services/booking-service
      dockerfile: Dockerfile
    depends_on: [kafka, redis, postgres, event-service]
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EVENT_SERVICE_BASE_URL: http://event-service:8081
    restart: on-failure

  event-service:
    build:
      context: ../services/event-service
      dockerfile: Dockerfile
    depends_on: [postgres]
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_events
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ticketing
      BOOKING_SERVICE_BASE_URL: http://booking-service:8082
    restart: on-failure

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    depends_on: [kafka, postgres]
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_payments
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    depends_on: [kafka, postgres]
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_notifications
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  waitlist-service:
    build:
      context: ../services/waitlist-service
      dockerfile: Dockerfile
    depends_on: [kafka, postgres, event-service]
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_waitlist
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_SERVICE_BASE_URL: http://event-service:8081
    restart: on-failure

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    depends_on: [event-service, booking-service, payment-service, notification-service, waitlist-service]
    ports:
      - "8080:8080"
    environment:
      EVENT_SERVICE_BASE_URL: http://event-service:8081
      BOOKING_SERVICE_BASE_URL: http://booking-service:8082
      BOOKING_SERVICE_WS_BASE_URL: ws://booking-service:8082
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8084
      WAITLIST_SERVICE_BASE_URL: http://waitlist-service:8085
    restart: on-failure

volumes:
  postgres_data:
