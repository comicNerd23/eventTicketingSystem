apiVersion: 1

providers:
  - name: Ticketing Platform
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Mounted from k8s/monitoring/dashboards, which prod's Grafana loads too (ADR-026).
      path: /var/lib/grafana/dashboards
