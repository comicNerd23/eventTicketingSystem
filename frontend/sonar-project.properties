# SonarQube Cloud analysis of the frontend (ADR-023), run by `node ci.js frontend --sonar`.
# Host, organization and project key come from ci.js; the token from SONAR_TOKEN.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.sourceEncoding=UTF-8
