<div class="flex min-h-screen flex-col bg-n-ground text-n-ink">
  <header class="sticky top-0 z-10 border-b border-n-hair bg-n-ground">
    <div class="mx-auto flex max-w-6xl items-center gap-2.5 px-4 py-4 sm:px-6">
      <span class="flex h-7 w-7 -rotate-6 items-center justify-center bg-n-pink font-display text-sm text-n-ground">
        ET
      </span>
      <a routerLink="/" class="font-display text-lg uppercase tracking-wide text-n-ink transition hover:text-n-pink">
        {{ title }}
      </a>
    </div>
  </header>

  <div class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 sm:px-6 sm:py-14">
    <router-outlet />
  </div>

  <footer class="border-t border-n-hair">
    <div class="mx-auto max-w-6xl px-4 py-10 text-sm text-n-ink-dim sm:px-6">
      <p class="font-display uppercase tracking-wide text-n-ink">{{ title }}</p>
      <p class="mt-2">Find and book tickets for concerts, sports, theatre, comedy, and more.</p>
      <p class="mt-4 text-xs text-n-ink-dim/70">&copy; {{ currentYear }} {{ title }} &mdash; a portfolio demo project.</p>
    </div>
  </footer>
</div>
