<div class="flex min-h-screen flex-col bg-gradient-to-b from-violet-50 via-white to-white">
  <header class="sticky top-0 z-10 border-b border-violet-100/70 bg-white/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-4">
      <a routerLink="/" class="flex items-center gap-2.5 text-xl font-extrabold text-gray-900 transition hover:text-violet-700">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-500 text-white shadow-sm">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="7" width="18" height="10" rx="2" />
            <line x1="12" y1="7" x2="12" y2="17" stroke-dasharray="2.2 2.2" />
          </svg>
        </span>
        {{ title }}
      </a>
    </div>
  </header>

  <div class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <router-outlet />
  </div>

  <footer class="border-t border-violet-100 bg-white/60">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-gray-500">
      <p class="font-semibold text-gray-700">{{ title }}</p>
      <p class="mt-1">Find and book tickets for concerts, sports, theatre, comedy, and more.</p>
      <p class="mt-3 text-xs text-gray-400">&copy; {{ currentYear }} {{ title }} &mdash; a portfolio demo project.</p>
    </div>
  </footer>
</div>
