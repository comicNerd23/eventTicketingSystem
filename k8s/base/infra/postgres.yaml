# One Postgres instance, one database per service (ADR-001). The init script only runs when
# the data volume is empty, i.e. on the first start of a fresh cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-databases.sql: |
    CREATE DATABASE ticketing_events;
    CREATE DATABASE ticketing_bookings;
    CREATE DATABASE ticketing_payments;
    CREATE DATABASE ticketing_notifications;
    CREATE DATABASE ticketing_waitlist;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ticketing
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            # A subdirectory, because the volume root may contain lost+found, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ticketing"]
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
