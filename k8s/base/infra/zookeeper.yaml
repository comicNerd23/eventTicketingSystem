# Same broker setup as docker-compose (cp-zookeeper + cp-kafka 7.5.0). ZooKeeper keeps a
# volume because Kafka does: a broker whose data outlives ZooKeeper's fails on a cluster-ID
# mismatch.
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx128m"
          readinessProbe:
            tcpSocket:
              port: 2181
            periodSeconds: 5
          resources:
            requests: { memory: 192Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
            - name: log
              mountPath: /var/lib/zookeeper/log
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 256Mi
    - metadata:
        name: log
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 256Mi
