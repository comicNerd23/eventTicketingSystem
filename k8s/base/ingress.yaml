# All browser traffic enters through api-gateway, which already routes /bookings/ws/** to
# booking-service's WebSocket endpoint (ADR-009). No ingressClassName: the cluster's default
# ingress controller picks it up.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
