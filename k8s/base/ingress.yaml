# All browser traffic enters through the frontend's nginx: it serves the Angular app and proxies
# /api/** (REST and the seat-status WebSocket) to api-gateway, stripping the prefix (ADR-019).
# A single rule keeps this Ingress controller-neutral — prefix stripping would otherwise need
# controller-specific annotations. No ingressClassName: the cluster's default controller picks it up.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
