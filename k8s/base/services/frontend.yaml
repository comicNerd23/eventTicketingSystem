# Angular build served by unprivileged nginx, which also proxies /api/** (REST and the seat-status
# WebSocket) to api-gateway — see ADR-019.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: ticketing/frontend
          ports:
            - containerPort: 8080
          env:
            - name: API_GATEWAY_URL
              value: http://api-gateway:8080
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
