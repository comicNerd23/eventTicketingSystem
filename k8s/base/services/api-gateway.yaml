apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: ticketing/api-gateway
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: EVENT_SERVICE_BASE_URL
              value: http://event-service:8081
            - name: BOOKING_SERVICE_BASE_URL
              value: http://booking-service:8082
            - name: BOOKING_SERVICE_WS_BASE_URL
              value: ws://booking-service:8082
            - name: PAYMENT_SERVICE_BASE_URL
              value: http://payment-service:8083
            - name: NOTIFICATION_SERVICE_BASE_URL
              value: http://notification-service:8084
            - name: WAITLIST_SERVICE_BASE_URL
              value: http://waitlist-service:8085
            # Set per environment by the overlay.
            - name: GATEWAY_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: gateway-config, key: cors-allowed-origins }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            # The default 1s is too tight while six JVMs share two CPUs.
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { memory: 300Mi, cpu: 100m }
            limits: { memory: 512Mi }
