# Settings shared by every environment. Downstream URLs and the CORS origin live in
# application-dev.yml (local defaults) and application-prod.yml (required env vars) — see ADR-017.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    # Local runs, docker compose and the test suites need no flag; prod sets SPRING_PROFILES_ACTIVE=prod.
    default: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: event-service
              uri: ${event.service.base-url}
              predicates:
                - Path=/venues/**,/events/**
            - id: booking-service-ws
              uri: ${booking.service.ws-base-url}
              predicates:
                - Path=/bookings/ws/**
            - id: booking-service
              uri: ${booking.service.base-url}
              predicates:
                - Path=/bookings/**
            - id: payment-service
              uri: ${payment.service.base-url}
              predicates:
                - Path=/payments/**
            - id: notification-service
              uri: ${notification.service.base-url}
              predicates:
                - Path=/notifications/**
            - id: waitlist-service
              uri: ${waitlist.service.base-url}
              predicates:
                - Path=/waitlist/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${gateway.cors.allowed-origins}"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.ticketing: INFO
    org.springframework.cloud.gateway: INFO
