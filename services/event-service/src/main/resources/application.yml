# Settings shared by every environment. Connection settings live in application-dev.yml
# (local defaults) and application-prod.yml (required env vars, no defaults) — see ADR-017.
server:
  port: 8081

spring:
  application:
    name: event-service
  profiles:
    # Local runs, docker compose and the test suites need no flag; prod sets SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks the entities against it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.ticketing: INFO
    org.hibernate.SQL: WARN
